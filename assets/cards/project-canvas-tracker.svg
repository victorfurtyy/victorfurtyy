<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #141414; stroke: #26be61; stroke-width: 1.5; rx: 10px; }
      .eyebrow { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #26be61; letter-spacing: 0.14em; }
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16.5px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #a8b0ab; }
      .bullet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #e0e0e0; }
      .bullet-icon { fill: #26be61; font-weight: bold; }
      .tag-bg { fill: #1a3d28; stroke: #26be61; stroke-opacity: 0.4; stroke-width: 1; rx: 4px; }
      .tag-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; fill: #33d975; }
      .badge-bg { fill: #1a3d28; stroke: #26be61; stroke-opacity: 0.5; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9.5px; font-weight: 700; fill: #26be61; letter-spacing: 0.08em; }
      .cta-btn { fill: #26be61; rx: 5px; }
      .cta-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #08140d; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="418" height="228" class="bg" />

  <!-- Eyebrow -->
  <text x="20" y="28" class="eyebrow">// OBSIDIAN PLUGIN &amp; WORKFLOW</text>

  <!-- Status Badge with ample room -->
  <rect x="295" y="14" width="105" height="22" class="badge-bg" />
  <text x="347" y="29" class="badge-text" text-anchor="middle">CLOSED BETA</text>

  <!-- Title Icon (Canvas / Board Columns) -->
  <g transform="translate(20, 39)">
    <rect x="0" y="1" width="4.5" height="15" rx="1.5" fill="#26be61" />
    <rect x="6.5" y="1" width="4.5" height="10" rx="1.5" fill="#26be61" />
    <rect x="13" y="1" width="4.5" height="13" rx="1.5" fill="#26be61" />
  </g>

  <!-- Title -->
  <text x="44" y="54" class="title">Canvas Task Tracker</text>

  <!-- Description -->
  <text x="20" y="74" class="desc">Spatial task orchestration plugin for Obsidian built around visual canvas metaphors.</text>

  <!-- Bullets -->
  <g transform="translate(20, 94)">
    <text x="0" y="0" class="bullet"><tspan class="bullet-icon">✦ </tspan>Non-linear spatial organization reducing user cognitive load</text>
    <text x="0" y="18" class="bullet"><tspan class="bullet-icon">✦ </tspan>Engineered strictly with TypeScript for Obsidian's API ecosystem</text>
    <text x="0" y="36" class="bullet"><tspan class="bullet-icon">✦ </tspan>Applied UX &amp; ergonomics principles to eliminate task friction</text>
    <text x="0" y="54" class="bullet"><tspan class="bullet-icon">✦ </tspan>Active closed beta testing with iterative user feedback loops</text>
  </g>

  <!-- Bottom Row: Tech Tags on left, Bold High-Contrast CTA Button on right -->
  <g transform="translate(20, 182)">
    <!-- Obsidian Plugin -->
    <rect x="0" y="0" width="102" height="24" class="tag-bg" />
    <text x="51" y="16" class="tag-text" text-anchor="middle">Obsidian Plugin</text>

    <!-- TypeScript -->
    <rect x="110" y="0" width="76" height="24" class="tag-bg" />
    <text x="148" y="16" class="tag-text" text-anchor="middle">TypeScript</text>

    <!-- UX Design -->
    <rect x="194" y="0" width="72" height="24" class="tag-bg" />
    <text x="230" y="16" class="tag-text" text-anchor="middle">UX Design</text>
  </g>

  <!-- CTA Button: Highly Visible Emerald Button -->
  <g transform="translate(295, 180)">
    <rect x="0" y="0" width="105" height="28" class="cta-btn" />
    <text x="52" y="18" class="cta-text" text-anchor="middle">OPEN APP ↗</text>
  </g>
</svg>
