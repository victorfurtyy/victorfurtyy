<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #141414; stroke: #26be61; stroke-width: 1.5; rx: 10px; }
      .eyebrow { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #26be61; letter-spacing: 0.14em; }
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #a8b0ab; }
      .bullet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #e0e0e0; }
      .bullet-icon { fill: #26be61; font-weight: bold; }
      .tag-bg { fill: #1a3d28; stroke: #26be61; stroke-opacity: 0.4; stroke-width: 1; rx: 4px; }
      .tag-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; fill: #33d975; }
      .badge-bg { fill: #26be61; rx: 4px; }
      .badge-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9.5px; font-weight: 700; fill: #08140d; letter-spacing: 0.08em; }
      .link-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; fill: #26be61; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="418" height="228" class="bg" />

  <!-- Eyebrow -->
  <text x="20" y="28" class="eyebrow">// SPATIAL PRODUCTIVITY TOOL</text>

  <!-- Status Badge -->
  <rect x="315" y="15" width="85" height="20" class="badge-bg" />
  <text x="357" y="29" class="badge-text" text-anchor="middle">LIVE BETA ↗</text>

  <!-- Title -->
  <text x="20" y="54" class="title">Canvas Task Tracker</text>

  <!-- Description -->
  <text x="20" y="74" class="desc">Spatial task orchestration replacing rigid lists with an interactive canvas.</text>

  <!-- Bullets -->
  <g transform="translate(20, 94)">
    <text x="0" y="0" class="bullet"><tspan class="bullet-icon">✦ </tspan>Non-linear spatial organization reducing user cognitive load</text>
    <text x="0" y="18" class="bullet"><tspan class="bullet-icon">✦ </tspan>Full UX/UI engineered from scratch in Figma with custom tokens</text>
    <text x="0" y="36" class="bullet"><tspan class="bullet-icon">✦ </tspan>Active closed beta testing with iterative feedback cycles</text>
    <text x="0" y="54" class="bullet"><tspan class="bullet-icon">✦ </tspan>High-performance state architecture built with TypeScript</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(20, 184)">
    <!-- Vue.js -->
    <rect x="0" y="0" width="56" height="22" class="tag-bg" />
    <text x="28" y="15" class="tag-text" text-anchor="middle">Vue.js</text>

    <!-- TypeScript -->
    <rect x="64" y="0" width="76" height="22" class="tag-bg" />
    <text x="102" y="15" class="tag-text" text-anchor="middle">TypeScript</text>

    <!-- Figma -->
    <rect x="148" y="0" width="54" height="22" class="tag-bg" />
    <text x="175" y="15" class="tag-text" text-anchor="middle">Figma</text>

    <!-- UX/UI -->
    <rect x="210" y="0" width="56" height="22" class="tag-bg" />
    <text x="238" y="15" class="tag-text" text-anchor="middle">UX/UI</text>

    <!-- Link hint -->
    <text x="380" y="15" class="link-text" text-anchor="end">Open App ↗</text>
  </g>
</svg>
