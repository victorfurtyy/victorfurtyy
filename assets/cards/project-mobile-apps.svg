<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #141414; stroke: #26be61; stroke-width: 1.5; rx: 10px; }
      .eyebrow { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #26be61; letter-spacing: 0.14em; }
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16.5px; font-weight: 700; fill: #ffffff; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #a8b0ab; }
      .bullet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #e0e0e0; }
      .bullet-icon { fill: #26be61; font-weight: bold; }
      .tag-bg { fill: #1a3d28; stroke: #26be61; stroke-opacity: 0.4; stroke-width: 1; rx: 4px; }
      .tag-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 600; fill: #33d975; }
      .badge-bg { fill: #21262d; stroke: rgba(255, 255, 255, 0.12); stroke-width: 1; rx: 4px; }
      .badge-text { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 9.5px; font-weight: 600; fill: #a8b0ab; letter-spacing: 0.04em; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="418" height="228" class="bg" />

  <!-- Eyebrow -->
  <text x="20" y="28" class="eyebrow">// CROSS-PLATFORM MOBILE &amp; PWA</text>

  <!-- Status Badge with ample room -->
  <rect x="260" y="14" width="140" height="22" class="badge-bg" />
  <text x="330" y="29" class="badge-text" text-anchor="middle">AGENCY CLIENT · NDA</text>

  <!-- Title Icon (Smartphone) -->
  <g transform="translate(20, 39)">
    <rect x="2" y="0.5" width="12" height="16" rx="2" fill="none" stroke="#26be61" stroke-width="1.6" />
    <line x1="6.5" y1="13.5" x2="9.5" y2="13.5" stroke="#26be61" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Title -->
  <text x="42" y="54" class="title">Mobile Apps &amp; Client PWAs</text>

  <!-- Description -->
  <text x="20" y="74" class="desc">Cross-platform iOS/Android apps and operations dashboards for agency clients.</text>

  <!-- Bullets -->
  <g transform="translate(20, 94)">
    <text x="0" y="0" class="bullet"><tspan class="bullet-icon">✦ </tspan>Native-feel hybrid applications engineered with Ionic &amp; Capacitor</text>
    <text x="0" y="18" class="bullet"><tspan class="bullet-icon">✦ </tspan>Operations management dashboards functioning as offline PWAs</text>
    <text x="0" y="36" class="bullet"><tspan class="bullet-icon">✦ </tspan>End-to-end UX lifecycle: field discovery, wireframes &amp; delivery</text>
    <text x="0" y="54" class="bullet"><tspan class="bullet-icon">✦ </tspan>Hardware sensors, REST API integrations &amp; state synchronization</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(20, 184)">
    <!-- Angular -->
    <rect x="0" y="0" width="62" height="22" class="tag-bg" />
    <text x="31" y="15" class="tag-text" text-anchor="middle">Angular</text>

    <!-- Ionic -->
    <rect x="70" y="0" width="50" height="22" class="tag-bg" />
    <text x="95" y="15" class="tag-text" text-anchor="middle">Ionic</text>

    <!-- Capacitor -->
    <rect x="128" y="0" width="70" height="22" class="tag-bg" />
    <text x="163" y="15" class="tag-text" text-anchor="middle">Capacitor</text>

    <!-- Android SDK -->
    <rect x="206" y="0" width="76" height="22" class="tag-bg" />
    <text x="244" y="15" class="tag-text" text-anchor="middle">Android SDK</text>

    <!-- iOS SDK -->
    <rect x="290" y="0" width="60" height="22" class="tag-bg" />
    <text x="320" y="15" class="tag-text" text-anchor="middle">iOS SDK</text>
  </g>
</svg>
